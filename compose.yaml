name: cli-rush

services:
  cli-rush:
    build:
      context: .
    container_name: cli-rush
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      CLI_RUSH_USERNAME: ${CLI_RUSH_USERNAME:-ignas}
      CLI_RUSH_COOKIE_SECURE: "true"
      CLI_RUSH_TRUST_PROXY: "true"
      CLI_RUSH_PUBLIC_ORIGIN: ${CLI_RUSH_PUBLIC_ORIGIN:?Set the public HTTPS URL in .env}
      CLI_RUSH_PASSWORD_HASH_FILE: /run/secrets/password_hash
      CLI_RUSH_SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - ./data:/data
    secrets:
      - password_hash
      - session_secret
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev

  init-storage:
    image: alpine:3.22
    profiles: ["setup"]
    command: ["sh", "-c", "test -f /secrets/password_hash && test -f /secrets/session_secret && chmod 0400 /secrets/password_hash /secrets/session_secret && chown 1000:1000 /secrets/password_hash /secrets/session_secret && chown -R 1000:1000 /data"]
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  init-secrets:
    image: node:24-alpine
    profiles: ["setup"]
    working_dir: /workspace
    command: ["node", "init-secrets.mjs"]
    stdin_open: true
    tty: true
    volumes:
      - ./scripts/init-secrets.mjs:/workspace/init-secrets.mjs:ro
      - ./secrets:/workspace/secrets
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  password_hash:
    file: ./secrets/password_hash
  session_secret:
    file: ./secrets/session_secret
