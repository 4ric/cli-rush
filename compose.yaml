services:
  cli-rush:
    build:
      context: .
    container_name: cli-rush
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      CLI_RUSH_USERNAME: ${CLI_RUSH_USERNAME:-ignas}
      CLI_RUSH_COOKIE_SECURE: "true"
      CLI_RUSH_TRUST_PROXY: "true"
      CLI_RUSH_PUBLIC_ORIGIN: ${CLI_RUSH_PUBLIC_ORIGIN:?Set the public HTTPS URL in .env}
      CLI_RUSH_PASSWORD_HASH_FILE: /run/secrets/password_hash
      CLI_RUSH_SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - /data/contrainers/cli-rush/data:/data
    secrets:
      - password_hash
      - session_secret
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev

secrets:
  password_hash:
    file: ./secrets/password_hash
  session_secret:
    file: ./secrets/session_secret
